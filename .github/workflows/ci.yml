name: Call CI Pipeline

on:
  push:
    branches: [ hml, main ]

jobs:
  ci-workflow:
    uses: Mauricio-Camilo-AWS-Projects/CI-CD-Workflows/.github/workflows/ci.yml@main

    permissions:
      security-events: write # Send results to Github Code Scanning
      actions: read 
      contents: read # Use for CodeQL in some scenarios

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
