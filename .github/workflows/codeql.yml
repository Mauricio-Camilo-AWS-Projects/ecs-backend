name: CodeQL

on:
  push:
    branches: [hml, main]

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4